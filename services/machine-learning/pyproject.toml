[project]
name = "stock-pilot-ml"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "devoncats", email = "devoncats.dev@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pandas>=3.0.5",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pandas-stubs>=3.0.3.260530",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.format]
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
